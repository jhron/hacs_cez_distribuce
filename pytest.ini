[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Auto mode: every `async def test_*` is run as an asyncio test without needing
# @pytest.mark.asyncio on each one.
asyncio_mode = auto

# Fail on unknown markers/typos so new marks are registered explicitly.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    integration: tests that hit the live ČEZ Distribuce portal (require CEZ_USERNAME and CEZ_PASSWORD env vars; auto-skipped otherwise)
